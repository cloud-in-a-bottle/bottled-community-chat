[app]
name = "bottle-community-chat"
version = "1.1.0"
description = "Cloud in a Bottle Community Chat: Matrix Synapse homeserver with a bundled web client, owner SSO, and one-click community-space join"

[runtime.container]
image = "Dockerfile"
# Cloud in a Bottle pulls this signed prebuilt image (built from the release tag's commit by CI) instead of building
# `image`. If you fork this app and change it, comment this line out so your instance builds `image` instead.
prebuilt_image = "registry.cloudinabottle.org/bottled-community-chat"
port = 3000

[routing]
public_paths = [
    "/_matrix/",
    "/_synapse/client/",
    "/.well-known/matrix/",
]

[[links]]
name = "admin"
path = "/_openhost/admin"

[resources]
memory_mb = 2048
cpu_cores = 2.0

[data]
app_data = true
